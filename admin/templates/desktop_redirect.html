<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeroRun 桌面客户端</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b1420;color:#dfe8f2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;}
  .box{max-width:460px;margin:24px;padding:48px 40px;background:#12202f;border:1px solid #1d3350;
    border-radius:16px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);}
  .logo{font-size:26px;font-weight:700;letter-spacing:.5px;color:#6fa8dc;margin-bottom:8px;}
  .title{font-size:17px;margin:18px 0 10px;font-weight:600;color:#fff;}
  .desc{font-size:14px;line-height:1.7;color:#93a9bd;margin:0 0 26px;}
  .hint{font-size:12px;color:#5f7a94;}
  code{background:#0b1420;padding:2px 8px;border-radius:6px;font-size:12px;color:#9cc5ef;}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">VeroRun</div>
    <div class="title">请使用 VeroRun 桌面客户端</div>
    <p class="desc">
      此页面为 {{ edition_label }} 的本地核心服务。管理功能集成在专属的
      <b>VeroRun 桌面客户端</b> 中，请勿通过浏览器直接访问。
      <br>请关闭本页面，打开 VeroRun 桌面客户端使用。
    </p>
    <p class="hint">本提示由本地核心自动生成 · {{ edition }}</p>
  </div>
</body>
</html>
