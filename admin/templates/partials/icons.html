    Object.keys(groups).forEach(function(gn){
      var items=groups[gn];
      var itemsHtml='';
      items.forEach(function(m){
        // 多子项插件 → 可展开插件入口（父项 + 缩进子项，如 Shop）
        if(m.children&&m.children.length){
          var cid='np-'+(++childSeq);
          var pIconHtml=I[m.icon]||I.plugins||'';
          itemsHtml+='<div class="ni ni-plugin" onclick="togglePlugin(\''+cid+'\',this)"><span class="ns-arrow">▶</span>'+pIconHtml+'<span>'+esc(m.label||m._plugin_id)+'</span></div>';
          itemsHtml+='<div class="ni-children collapsed" id="'+cid+'">';
          m.children.forEach(function(c){
            var iconHtml=I[c.icon]||I.plugins||'';
            itemsHtml+='<div class="ni ni-child" onclick="goPlugin(\''+escAttr(c.key||c._plugin_id)+'\',\''+escAttr(c.embed_url||'')+'\')" id="n-'+escAttr(c.key||c._plugin_id)+'">'+iconHtml+'<span>'+esc(c.label)+'</span></div>';
          });
          itemsHtml+='</div>';
        } else {
          var iconHtml=I[m.icon]||I.plugins||'';
          itemsHtml+='<div class="ni" onclick="goPlugin(\''+escAttr(m.key||m._plugin_id)+'\',\''+escAttr(m.embed_url||'')+'\')" id="n-'+escAttr(m.key||m._plugin_id)+'">'+iconHtml+'<span>'+esc(m.label)+'</span></div>';
        }
      });
      // 若插件 group 匹配现有组（英文标识），插入该组 body，避免新建重复组
      var existIdx=GROUP_KEYS.indexOf(gn);
      if(existIdx>=0){
        var body=document.getElementById("ngb-"+existIdx);
        if(body){body.insertAdjacentHTML('beforeend',itemsHtml);return;}
      }
      // 否则新建插件组
      ph+='<div class="ng" id="ng-'+gIdx+'"><div class="ns" onclick="toggleGroup('+gIdx+')"><span class="ns-arrow">▼</span><span class="ns-label">'+esc(gn)+'</span></div><div class="ng-body" id="ngb-'+gIdx+'">'+itemsHtml+'</div></div>';
      gIdx++;
    });
    if(ph)e.insertAdjacentHTML('beforeend',ph);
  }).catch(function(){});
}
function toggleGroup(i){var b=document.getElementById("ngb-"+i),a=document.querySelector("#ng-"+i+" .ns-arrow");b.classList.contains("collapsed")?(b.classList.remove("collapsed"),a.textContent="▼"):(b.classList.add("collapsed"),a.textContent="▶")}
function togglePlugin(id,el){var b=document.getElementById(id),a=el.querySelector(".ns-arrow");if(!b)return;b.classList.contains("collapsed")?(b.classList.remove("collapsed"),a.textContent="▼"):(b.classList.add("collapsed"),a.textContent="▶")}
renderNav();
