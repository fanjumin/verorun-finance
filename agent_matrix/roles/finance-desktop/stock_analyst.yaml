name: Stock Analyst
slug: stock_analyst
role_type: sub
# 本角色只存在于 roles/finance-desktop/（官方根目录无同名文件）。
# agent_matrix/models.py:_load_all_role_yamls 在 edition=finance-desktop 时会跳过
# editions 不含 finance-desktop 的条目 → 原值 official 使本角色在任何版本下都无法加载，
# 连带让金融桌面版旗舰插件 stock_analysis 的 agent_role 校验失败（discovery 记
# last_error）、其 capabilities 无法聚合进统一网关角色。与同目录其余角色保持一致。
editions:
  - finance-desktop
description: Financial analysis specialist — market data, indicators, strategy research
domain: finance
managed_modules:
  - stock_analysis
provider: deepseek
model_name: deepseek-v4-flash
system_prompt: prompts/sub_stock_analyst_prompt.md
is_system: true
is_active: 1
