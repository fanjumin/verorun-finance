# VeroRun 金融桌面版发行配置（单一事实源：插件白名单 + 角色集 + 核心文件）
# 由 sync-to-pro.yml 消费；verify-edition-payload.sh 校验产物一致性。
edition: finance-desktop
label: 金融桌面版
# 服务启用与禁用（edition 门控，deploy/editions/*.yaml 单一事实源）
# 桌面包裹版：关闭用户向 Web 服务（对应物理服务 verorun-main/8081 与 verorun-auth/8083）
services:
  user_login: false
  user_console: false
  main_site: false
# 许可证/订阅到期强制（agent_matrix.models.edition_requires_license() 消费）
# 2026-09-11 产品决策：桌面金融版「订阅到期即锁」，一律 fail-closed（未配置/未知/过期
# 均拒绝，不"默认放行+事后告警"）。其它发行版不写这一行 → 不启用（opt-in 语义）。
license_enforcement: true
plugins:
  include:
    - _base
    - captcha_embedded
    - email
    - health_check
    - sms
    - site_domains
    - two_factor_auth
    - analytics
    - memory_engine
    - vault
    - content_factory
    - stock_analysis
    - shop
    - payment
    - subscription
    - coupons
    - logistics
    - wishlist
    - order_notify
    - reviews
    - ali_api
    - currency_converter
    - ads
    - social_push
    - im_gateway
    - enterprise_verify
  exclude:
    - project_workspace
    - veroscholar
    # hr_recruit：其 agent_role=office 在 agent_matrix/roles/09-office.yaml 声明 editions:[official]，
    # 金融版按 edition 过滤角色集后，discovery 的「agent_role 须为核心角色」校验必然失败
    # （R1 注册表 last_error 即此）。金融版不承载 HR 招聘域 → 显式排除；
    # 不把 agent_role 改成 ops：那会为修一个版本的报错而改掉另一版本已成立的角色契约。
    - hr_recruit
roles:
  - athena
  - finance
  - ops
  - business          # shop/coupons/logistics/wishlist/reviews/ali_api/currency_converter
  - content           # content_factory/analytics/ads/social_push
  - service           # email/sms/two_factor_auth/im_gateway/enterprise_verify
  - builder           # site_domains
  - rs_planner
  - rs_fundamental
  - rs_quant
  - rs_risk
  - rs_pm
  - rs_compliance
  - stock_analyst
core_files:
  - agent_matrix/models.py
  - agent_matrix/routes.py
  - auth-center/models/database.py
  - auth-center/services/kb_permission.py
