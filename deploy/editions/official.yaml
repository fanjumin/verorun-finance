# VeroRun 官方版发行配置（服务器版：默认全开，判定兜底）
# 未设 VR_EDITION 的老部署一律按 official 处理，不破坏现有部署。
# 官方版不经 sync-to-* 流水线分发（verorun-code 直出），本文件仅作为
# edition 服务门控的单一事实源，供 is_service_enabled() 消费。
edition: official
label: 官方版
services:
  user_login: true
  user_console: true
  main_site: true
plugins:
  # 【2026-09-16 用户拍板】标准版/官方版（本文件为两者唯一事实源）放开边缘插件：
  # iot_hub/ros_bridge/cogevolution_substrate 在目录中**可见、可安装，但不随包预装**
  # （所有硬件网关走标准版发布，按需从商店安装）。
  # 仍仅限方向版：stock_analysis（金融版）/veroscholar（科研版）。
  # 【2026-09-17 插件标准 v1.8 §18.6】exclude 黑名单机制已退出（edition_plugin_excludes()
  # 恒返回 []），下方列表不再参与任何判定，仅作历史留档；插件可见性改由插件自身
  # plugin.json 的 compatible_editions 决定（stock_analysis=["finance"]、veroscholar=["research"]）。
  exclude:
    - stock_analysis
    - veroscholar
