# VeroRun 科研桌面版发行配置（单一事实源：插件白名单 + 角色集 + 核心文件）
# 由 sync-to-edu.yml 消费；verify-edition-payload.sh 校验产物一致性。
edition: research-desktop
label: 科研桌面版
# 服务启用与禁用（edition 门控，deploy/editions/*.yaml 单一事实源）
# 桌面包裹版：关闭用户向 Web 服务（对应物理服务 verorun-main/8081 与 verorun-auth/8083）
services:
  user_login: false
  user_console: false
  main_site: false
plugins:
  # 【2026-09-07 用户拍板】认知进化后端采用 memory_engine（服务端全量版），
  # 不使用 cogevolution_substrate；project_workspace 移出科研版；vault 保留。
  # 【2026-09-08 用户拍板】content_factory / site_domains 对科研版毫无价值，移入 exclude。
  include:
    - _base
    - captcha_embedded
    - email
    - health_check
    - sms
    - two_factor_auth
    - memory_engine
    - vault
    - veroscholar
  exclude:
    - cogevolution_substrate
    - project_workspace
    - content_factory
    - site_domains
    - shop
    - payment
    - subscription
    - coupons
    - logistics
    - wishlist
    - order_notify
    - reviews
    - ali_api
    - currency_converter
    - ads
    - social_push
    - enterprise_verify
roles:
  - athena
  - veroscholar
  - lit_scout
  - method_architect
  - thesis_smith
  - peer_auditor
core_files:
  - agent_matrix/models.py
  - agent_matrix/routes.py
  - auth-center/models/database.py
  - auth-center/services/kb_permission.py
