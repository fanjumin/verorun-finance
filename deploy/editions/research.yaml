# VeroRun 科研版发行配置（单一事实源：插件白名单 + 角色集 + 核心文件）
# 由 sync-to-edu.yml 消费；verify-edition-payload.sh 校验产物一致性。
edition: research
label: 科研版
# 服务启用与禁用（edition 门控，deploy/editions/*.yaml 单一事实源）
# 桌面包裹版：关闭用户向 Web 服务（对应物理服务 verorun-main/8081 与 verorun-auth/8083）
services:
  user_login: false
  user_console: false
  main_site: false
plugins:
  include:
    - _base
    - captcha_embedded
    - email
    - health_check
    - sms
    - site_domains
    - two_factor_auth
    - analytics
    - project_workspace
    - memory_engine
    - vault
    - content_factory
    - veroscholar
  exclude:
    - shop
    - payment
    - subscription
    - coupons
    - logistics
    - wishlist
    - order_notify
    - reviews
    - ali_api
    - currency_converter
    - ads
    - social_push
    - enterprise_verify
roles:
  - athena
  - veroscholar
  - content
  - builder
  - ops
  - service
  - vision
  - creative
core_files:
  - agent_matrix/models.py
  - agent_matrix/routes.py
  - auth-center/models/database.py
  - auth-center/services/kb_permission.py
