# ============================================================
# VeroRun — 单容器 Nginx 路由配置
# 与生产 install.sh 拓扑一致，仅暴露 80 端口：
#   /            → 8081 主站 (auth_server)
#   /admin/      → 8084 管理后台 (admin.app)
#   /auth/       → 8083 认证/平台 (main_site)
#   /subscribe   → 8083 订阅
#   /health      → 8085 健康检查 (health_service.app)
# ============================================================

# 审计 M5：认证/管理面 nginx 层限速（http 级 zone，供 server 内 location 引用）
limit_req_zone $binary_remote_addr zone=verorun_auth:10m rate=10r/s;

# 审计 M9：access_log 脱敏——用 $uri（不含 query）替代 $request，防 token 泄露日志
log_format verorun_redact '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer"';

server {
    listen 80 default_server;
    server_name _;
    # 审计 D6：TLS 占位符——entrypoint 检测挂载证书（SSL_CERT_DIR）后注入 443 ssl 配置，
    # 无证书则删除占位符（纯 HTTP，容器内 nginx -t 通过）
    __SSL_LISTEN__
    __SSL_CERT__
    # 审计 M3：隐藏 nginx 精确版本号
    server_tokens off;
    access_log /var/log/nginx/verorun-access.log verorun_redact;
    # 审计 P2-3：client_max_body_size 提升至 server 级，覆盖 / 与 /auth/ 上传（含头像/文件）
    client_max_body_size 100M;

    # 健康检查（供容器编排探活）
    location = /health {
        proxy_pass http://127.0.0.1:8085/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 审计 M1：XFF 覆盖为直连 IP（$remote_addr），不追加客户端伪造值
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 管理后台（前缀 /admin/ → 8084）
    location /admin/ {
        limit_req zone=verorun_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 审计 M1：XFF 覆盖为直连 IP（$remote_addr），不追加客户端伪造值
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
    }

    # 审计 D1：debug-jwt 已删除，nginx 层纵深防御直接 404
    location = /admin/debug-jwt {
        return 404;
    }

    # 审计 M17：上传目录中的 HTML/SVG 强制下载，防存储型 XSS（regex 优先级最高）
    location ~* ^/admin/static/uploads/.*\.(html?|svg)$ {
        add_header Content-Disposition "attachment; filename=download" always;
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~* ^/static/uploads/.*\.(html?|svg)$ {
        add_header Content-Disposition "attachment; filename=download" always;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~* ^/auth/static/uploads/.*\.(html?|svg)$ {
        add_header Content-Disposition "attachment; filename=download" always;
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth 第三方登录（/auth/oauth/* → 8081，oauth_bp 仅注册于 auth_server）
    # 注意：须置于 ^/(auth|subscribe) 之前，nginx 正则按配置顺序匹配
    location ~ ^/auth/oauth/ {
        limit_req zone=verorun_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 认证 / 订阅（/auth/ 与 /subscribe → 8083）
    location ~ ^/(auth|subscribe) {
        limit_req zone=verorun_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 审计 M1：XFF 覆盖为直连 IP（$remote_addr），不追加客户端伪造值
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 主站（根路由 → 8081）
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 审计 M1：XFF 覆盖为直连 IP（$remote_addr），不追加客户端伪造值
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 审计 M8：WebSocket 支持（小程序 wss 握手需 HTTP/1.1 + Upgrade 头）
    location ~ ^/(ws|socket\.io)(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 安全头（审计 M3：补充 CSP）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' ws: wss: https:; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
