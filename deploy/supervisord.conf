# ============================================================
# VeroRun — 单容器 Supervisor 配置
# 管理 nginx + 4 个 gunicorn 服务（与 install.sh systemd 定义一致）
# 服务模块路径参考 deploy/install.sh write_systemd_services()
# ============================================================

[supervisord]
nodaemon=true
# 审计 D7：supervisord 以 root 运行（PID1 管理进程），
# gunicorn 子进程显式降权到 verorun，nginx 保持 root 绑定 80 端口。
# 删除全局 user=verorun，消除“supervisord 全局降权后子进程再提权”的矛盾模型。
# 审计 P3-5：日志落盘便于排障
# 审计 M15：logfile_maxbytes=0 无限增长会写满容器可写层，改为 50MB×5 轮转
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
pidfile=/var/run/supervisord.pid

# ── nginx（先启动；审计 P3-4：单独指定 root，因绑定 80 端口需特权） ──
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 8081 主站 (auth_server) ──
# 审计 PERF-001：sync worker → gthread 线程池（pbkdf2 走 OpenSSL 释放 GIL，可并行哈希）
[program:verorun-main]
command=/usr/local/bin/gunicorn -w 2 -k gthread --threads 4 -b 127.0.0.1:8081 --timeout 120 --log-level warning auth_server:app
directory=/app
user=verorun
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 8083 认证/平台 (main_site) ──
[program:verorun-auth]
command=/usr/local/bin/gunicorn -w 2 -k gthread --threads 4 -b 127.0.0.1:8083 --timeout 120 --log-level warning main_site:app
directory=/app
user=verorun
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 8084 管理后台 (admin.app，经 run_gunicorn.py 避免 platform/ 遮蔽 stdlib) ──
[program:verorun-admin]
command=/usr/local/bin/python admin/run_gunicorn.py -w 2 -k gthread --threads 4 -b 127.0.0.1:8084 --timeout 300 --max-requests=1000 --graceful-timeout=30 --log-level warning --config admin/gunicorn_config.py admin.app:app
directory=/app
user=verorun
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 8085 健康检查 (health_service.app) ──
[program:verorun-health]
command=/usr/local/bin/gunicorn -w 2 -k gthread --threads 4 -b 127.0.0.1:8085 --timeout 30 --graceful-timeout=30 --log-level warning health_service.app:app
directory=/app
user=verorun
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── VeroGuard 守护进程（健康监控 + 完整性校验 + 心跳上报） ──
# 与裸机版 systemd 服务 verorun-guardian（deploy/lib/common.sh write_guardian_service）对齐。
# 以 root 运行：完整性校验需读取全部项目文件（与裸机版 User=root 一致）。
# 环境变量由 entrypoint.sh source .env 后由 supervisord 子进程继承
# （PROBE_SECRET / DEPLOYMENT_CODE / APP_REGION / GUARDIAN_REMOTE_URL 等）。
# 离线隐私：.env 中设 GUARDIAN_REMOTE_URL=off 时，config 返回空 REMOTE_URL，
# communicator.send_heartbeat 检测到空值即跳过上报。
# 注意：容器内无 systemd，阶梯恢复的 systemctl 重启会静默失败（不崩溃），
# 健康监控/完整性校验/心跳上报均正常工作。
[program:verorun-guardian]
command=/usr/local/bin/python veroguard/guardian.py
directory=/app
user=root
environment=GUARDIAN_PROJECT_DIR="/app",GUARDIAN_LOG_FILE="/dev/stdout"
autostart=true
autorestart=true
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
