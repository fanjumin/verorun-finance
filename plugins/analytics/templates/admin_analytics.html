// 确保 analytics-dashboard.js 仅加载一次（内联注入不执行 <script>，须由本函数动态加载）
window._analyticsJsLoaded=false;
window._ensureAnalyticsJs=function(cb){
  if(window._analyticsJsLoaded){cb();return}
  var s=document.createElement('script');
  s.src='/admin/analytics/dashboard.js';
  s.onload=function(){window._analyticsJsLoaded=true;cb()};
  s.onerror=function(){
    document.getElementById("mc").innerHTML='<div class="em">⚠️ {{ _('Script Load Failed') }}</div>';
  };
  document.head.appendChild(s);
};

window.l_analytics=function(){
  document.getElementById("pt").textContent="{{ _('Analytics') }}";
  document.getElementById("mc").innerHTML='<div class="lo"><div class="s"></div>{{ _('Loading...') }}...</div>';
  window._ensureAnalyticsJs(function(){
    var xhr=new XMLHttpRequest();
    xhr.open('GET','/admin/analytics/?fragment=1',true);
    xhr.setRequestHeader('Authorization','Bearer '+T);
    xhr.onload=function(){
      if(xhr.status===200){
        document.getElementById("mc").innerHTML=xhr.responseText;
        if(typeof window.initAnalyticsDashboard==="function")window.initAnalyticsDashboard();
      }else{
        document.getElementById("mc").innerHTML='<div class="em">⚠️ {{ _('Load failed') }} HTTP '+xhr.status+'</div>';
      }
    };
    xhr.onerror=function(){
      document.getElementById("mc").innerHTML='<div class="em">⚠️ {{ _('Network Request Failed') }}</div>';
    };
    xhr.send();
  });
}
