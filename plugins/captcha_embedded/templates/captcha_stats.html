{#
  Captcha 验证码统计页（内嵌于父模板，由插件菜单/统计入口加载）
  ── 外部全局依赖（由父模板 / 主系统提供，勿在本文件删除）：
     - esc(str)      : HTML 转义函数
     - T             : 管理员 Bearer Token（JWT）
     - showToast(msg): 全局消息提示
  ── 数据 API：GET /api/captcha/admin/stats/（Bearer T）
     返回 {total_requests, pass_rate, avg_risk, ip_fails, last_hour}
  ── §12.11：本文件为裸 JS，禁止 <script> 标签
#}
window.l_captcha_stats=function(){
  document.getElementById("pt").textContent="{{ _('Captcha Statistics') }}";
  document.getElementById("mc").innerHTML='<div class="lo"><div class="s"></div>{{ _('Loading...') }}</div>';
  fetch("/api/captcha/admin/stats/",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d||typeof d.total_requests==="undefined"){
      document.getElementById("mc").innerHTML='<p style="padding:20px;color:var(--dim)">{{ _('No statistics available') }}</p>';
      return;
    }
    var pass=Math.round((d.pass_rate||0)*100);
    var h='<div class="sbar"><b>{{ _("Captcha Statistics") }}</b></div>';
    h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px">';
    h+='<div class="sc"><div class="scv">'+esc(String(d.total_requests||0))+'</div><div class="scl">{{ _("Total Requests") }}</div></div>';
    h+='<div class="sc"><div class="scv">'+pass+'%</div><div class="scl">{{ _("Pass Rate") }}</div></div>';
    h+='<div class="sc"><div class="scv">'+esc(String(d.last_hour||0))+'</div><div class="scl">{{ _("Requests Last Hour") }}</div></div>';
    h+='</div>';
    h+='<div style="padding:0 16px 16px;font-size:12px;color:var(--dim)">';
    h+='<div>{{ _("Avg Risk Score") }}: '+esc(String((d.avg_risk||0)))+'</div>';
    var fails=(d.ip_fails||[]).slice(0,5);
    if(fails.length){
      h+='<div style="margin-top:8px">{{ _("Top IP Fails") }}:</div><ol style="margin:4px 0 0 18px">';
      for(var i=0;i<fails.length;i++){h+='<li>'+esc(fails[i].ip)+' ('+esc(String(fails[i].fails||0))+')</li>';}
      h+='</ol>';
    }
    h+='</div>';
    document.getElementById("mc").innerHTML=h;
  }).catch(function(){
    document.getElementById("mc").innerHTML='<p style="padding:20px;color:var(--dim)">{{ _("Load failed") }}</p>';
  });
};
