// AI 优惠券推荐组件 — 嵌入结算页（裸 JS partial，§12.11 禁止 <script> 标签）
/**
 * 在结算页显示 AI 优惠券推荐。
 * 调用方式:
 *   renderCouponRecommend(amount, scene, containerId);
 *
 * 依赖:
 *   - window.T (Bearer token)
 *   - showToast() 核心函数
 */
window.renderCouponRecommend=function(amount, scene, containerId){
  var el=document.getElementById(containerId);
  if(!el)return;
  el.innerHTML='<div class="lo"><div class="s"></div>{{ _('AI Analyzing...') }}</div>';
  fetch("/plugin/coupons/ai/recommend",{
    method:"POST",
    headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"},
    body:JSON.stringify({amount:amount,scene:scene||''})
  }).then(function(r){return r.json()}).then(function(d){
    if(!d.success||!d.data||!d.data.best){
      el.innerHTML='';
      return;
    }
    var r=d.data;
    var c=r.best;
    var h='<div class="cd" style="border:1px solid var(--accent);margin-top:8px">';
    h+='<div class="st" style="font-size:13px">🤖 {{ _('AI Recommended Coupon') }}</div>';
    h+='<div style="padding:8px;display:flex;justify-content:space-between;align-items:center">';
    h+='<div><strong>'+esc(c.name||c.code)+'</strong>';
    h+='<div style="font-size:11px;color:var(--dim)">'+esc(c.description||'')+'</div></div>';
    h+='<div style="text-align:right"><div style="font-size:18px;font-weight:700;color:var(--accent)">-¥'+r.estimated_saving+'</div>';
    h+='<div style="font-size:11px;color:var(--dim)">{{ _('Est. Savings') }}</div></div></div>';
    h+='<div style="padding:0 8px 8px">';
    if(r.applied_automatically){
      h+='<span class="bdg on">{{ _('Auto-applied') }}</span>';
    }else{
      h+='<button class="btn bp" onclick="applyCouponRecommend(\''+esc(c.code)+'\')">{{ _('Apply') }}</button>';
    }
    h+='</div></div>';
    el.innerHTML=h;
  }).catch(function(){el.innerHTML='';});
};

window.applyCouponRecommend=function(code){
  // 将优惠码填入结算页的优惠券输入框
  var inp=document.getElementById("couponCodeInput");
  if(inp){inp.value=code;inp.dispatchEvent(new Event('input'));}
  var btn=document.getElementById("applyCouponBtn");
  if(btn)btn.click();
  showToast("✅ {{ _('Coupon applied: ') }}"+code,"success");
};
