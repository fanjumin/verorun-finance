// Logistics Management — 物流查询插件管理面板
// 无 <script> 标签，遵循插件模板铁律 §12.11

window.l_logistics = function(){
  document.getElementById("pt").textContent = "{{ _('logistics_management') }}";
  var h='<div class="cd"><div id="logistics-content"></div></div>';
  document.getElementById("mc").innerHTML = h;
  loadLogisticsMain();
};

function loadLogisticsMain(){
  var ct = document.getElementById("logistics-content");
  ct.innerHTML =
    '<div class="cd" style="margin-bottom:12px"><div class="st">{{ _('logistics_tracking') }}</div>'+
    '<div class="g2" style="margin-top:8px">'+
    '<div><div style="font-size:11px;color:var(--dim)">{{ _('shipper_code') }}</div><input class="in" id="lg-shipper" placeholder="SF/YTO/ZTO" style="width:100%"></div>'+
    '<div><div style="font-size:11px;color:var(--dim)">{{ _('logistic_code') }}</div><input class="in" id="lg-code" style="width:100%"></div>'+
    '<div><div style="font-size:11px;color:var(--dim)">{{ _('order_code') }} ({{ _('Optional') }})</div><input class="in" id="lg-order" style="width:100%"></div>'+
    '</div>'+
    '<div style="margin-top:8px"><button class="btn bp" onclick="doLogisticsQuery()">{{ _('query') }}</button></div>'+
    '<div id="lg-result" style="margin-top:12px"></div>'+
    '</div>'+
    '<div class="cd"><div class="st">{{ _('query_history') }}</div><div id="lg-history"></div></div>';
  loadLogisticsHistory();
}

function doLogisticsQuery(){
  var shipper = document.getElementById("lg-shipper").value.trim();
  var code = document.getElementById("lg-code").value.trim();
  var order = document.getElementById("lg-order").value.trim();
  if(!shipper||!code){showToast("{{ _('Carrier code and tracking number required') }}","error");return}
  var resultDiv = document.getElementById("lg-result");
  resultDiv.innerHTML = '<div style="text-align:center;padding:12px"><div class="s" style="display:inline-block"></div></div>';
  fetch("/admin/logistics/query", {method:"POST", headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"}, body:JSON.stringify({shipper_code:shipper,logistic_code:code,order_code:order})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.success){
      var data = d.data;
      var h = '<div class="cd" style="background:var(--bg2)"><div class="st">{{ _('query_result') }}</div>'+
        '<div style="font-size:12px;margin-bottom:8px"><strong>{{ _('state') }}:</strong> '+esc(data.state_text)+' ('+data.state+')</div>';
      if(data.location) h+='<div style="font-size:12px;margin-bottom:8px"><strong>{{ _('Location') }}:</strong> '+esc(data.location)+'</div>';
      if(data.traces&&data.traces.length){
        h+='<table><tr><th>{{ _('time') }}</th><th>{{ _('station') }}</th><th>{{ _('remark') }}</th></tr>';
        data.traces.forEach(function(t){
          h+='<tr><td style="white-space:nowrap">'+esc(t.time)+'</td><td>'+esc(t.station)+'</td><td>'+esc(t.remark||'')+'</td></tr>';
        });
        h+='</table>';
      }else{
        h+='<div class="em">{{ _('No Records') }}</div>';
      }
      h+='</div>';
      resultDiv.innerHTML = h;
      loadLogisticsHistory();
    }else{
      resultDiv.innerHTML = '<div class="em">'+esc(d.error||'{{ _('query_failed') }}')+'</div>';
    }
  }).catch(function(){resultDiv.innerHTML = '<div class="em">{{ _('Request Failed') }}</div>'});
}

function loadLogisticsHistory(){
  var ct = document.getElementById("lg-history");
  ct.innerHTML = '<div style="text-align:center;padding:12px;color:var(--dim)"><div class="s" style="display:inline-block"></div>{{ _('loading') }}...</div>';
  fetch("/admin/logistics/history", {headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success||!d.data){ct.innerHTML='<div class="em">{{ _('no_records') }}</div>';return}
    var items = d.data.items||[];
    if(!items.length){ct.innerHTML='<div class="em">{{ _('no_records') }}</div>';return}
    var h='<table><tr><th>{{ _('shipper_code') }}</th><th>{{ _('logistic_code') }}</th><th>{{ _('state') }}</th><th>{{ _('time') }}</th></tr>';
    items.forEach(function(r){
      h+='<tr><td>'+esc(r.shipper_code)+'</td><td>'+esc(r.logistic_code)+'</td><td>'+(r.success?'✅':'❌ '+esc(r.error_msg))+'</td><td>'+esc(r.queried_at)+'</td></tr>';
    });
    h+='</table>';
    ct.innerHTML = h;
  }).catch(function(){ct.innerHTML='<div class="em">{{ _('load_failed') }}</div>'});
}
