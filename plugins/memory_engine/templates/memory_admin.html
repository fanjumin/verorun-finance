  var root = document.getElementById('mc');
  if (!root) return;

  root.innerHTML =
    '<div class="pg">' +
      // ── 用途说明 ──
      '<div class="cd" style="margin-bottom:16px">' +
        '<div class="st">🧠 {{ _("CogEvolution") }}</div>' +
        '<p style="margin-top:6px;font-size:12.5px;color:var(--muted);line-height:1.8">' +
          '{{ _("Automatically remembers user preferences, facts and lessons across agent conversations, and injects the most relevant memory into each new session for personalization.") }}' +
        '</p>' +
        '<p id="mem-hint" style="margin-top:8px;font-size:12px;color:var(--dim)">' +
          '{{ _("Loading status...") }}' +
        '</p>' +
      '</div>' +
      // ── 实时统计 ──
      '<div class="gr" id="mem-stats"></div>' +
      // ── 记忆列表 ──
      '<div class="cd" style="margin-top:16px">' +
        '<div class="st">{{ _("Memories") }}</div>' +
        '<div class="sbar">' +
          '<input id="mem-search" class="in" placeholder="{{ _("Search memories...") }}"/>' +
          '<button class="btn bp" onclick="window.__memLoad()">{{ _("Search") }}</button>' +
        '</div>' +
        '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:6px">' +
          '<table id="mem-table"><thead><tr><th>{{ _("Type") }}</th><th>{{ _("Content") }}</th><th>{{ _("Owner") }}</th><th>{{ _("Quality") }}</th><th></th></tr></thead><tbody></tbody></table>' +
        '</div>' +
      '</div>' +
      // ── 知识沉淀审核队列 ──
      '<div class="cd" style="margin-top:16px">' +
        '<div class="st">🧬 {{ _("Knowledge Sedimentation") }}</div>' +
        '<div class="sbar">' +
          '<span id="sed-count" style="font-size:12px;color:var(--dim)"></span>' +
          '<button class="btn bp" style="margin-left:8px" onclick="window.__sedRun()">{{ _("Run Scan") }}</button>' +
        '</div>' +
        '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:6px">' +
          '<table id="sed-table"><thead><tr><th>{{ _("Content") }}</th><th>{{ _("Owner") }}</th><th>{{ _("Type") }}</th><th>{{ _("Quality") }}</th><th></th></tr></thead><tbody></tbody></table>' +
        '</div>' +
      '</div>' +
    '</div>';

  window.__memLoadStats();
  window.__memLoad();
  window.__sedLoad();
};

window.__sedLoad = function () {
  fetch('/admin/memory/sedimentation?status=pending', { headers: { 'Authorization': 'Bearer ' + T } })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var tb = document.querySelector('#sed-table tbody');
      var cnt = document.getElementById('sed-count');
      if (!tb) return;
      if (!data.ok) {
        tb.innerHTML = '<tr><td colspan="5" class="em">' + esc(data.error || '{{ _("Failed to load sedimentation data") }}') + '</td></tr>';
        return;
      }
      var rows = data.rows || [];
      if (cnt) cnt.textContent = rows.length + ' {{ _("Pending") }}';
      tb.innerHTML = '';
      if (!rows.length) {
        tb.innerHTML = '<tr><td colspan="5" class="em">{{ _("No pending sedimentation items") }}</td></tr>';
        return;
      }
      rows.forEach(function (s) {
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + esc(String(s.title || s.content).slice(0, 120)) + '</td>' +
          '<td>' + esc(s.owner_id || '-') + '</td>' +
          '<td>' + esc(s.memory_type) + '</td>' +
          '<td>' + esc(Number(s.quality_score || 0).toFixed(2)) + '</td>' +
          '<td>' +
            '<button class="btn bp" onclick="window.__sedApprove(\'' + s.id + '\')">{{ _("Approve") }}</button> ' +
            '<button class="btn" style="background:var(--danger);color:#fff" onclick="window.__sedReject(\'' + s.id + '\')">{{ _("Reject") }}</button>' +
          '</td>';
        tb.appendChild(tr);
      });
    })
    .catch(function (e) {
      var tb = document.querySelector('#sed-table tbody');
      if (tb) tb.innerHTML = '<tr><td colspan="5" class="em">' + esc(e.message) + '</td></tr>';
    });
};

window.__sedApprove = function (id) {
  fetch('/admin/memory/sedimentation/' + id + '/approve', { method: 'POST', headers: { 'Authorization': 'Bearer ' + T } })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ok) { window.__sedLoad(); }
      else { console.error('Approve failed:', d && d.error); window.__sedLoad(); }
    })
    .catch(function (e) { console.error('Approve failed:', e); });
};

window.__sedReject = function (id) {
  fetch('/admin/memory/sedimentation/' + id + '/reject', { method: 'POST', headers: { 'Authorization': 'Bearer ' + T } })
    .then(function (r) { return r.json(); })
    .then(function () { window.__sedLoad(); })
    .catch(function (e) { console.error('Reject failed:', e); });
};

window.__sedRun = function () {
  fetch('/admin/memory/sedimentation/run', { method: 'POST', headers: { 'Authorization': 'Bearer ' + T } })
    .then(function (r) { return r.json(); })
    .then(function () { window.__sedLoad(); })
    .catch(function (e) { console.error('Run scan failed:', e); });
};

window.__memLoadStats = function () {
  fetch('/admin/plugins/metrics', { headers: { 'Authorization': 'Bearer ' + T } })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var s = (data && data.data && data.data.plugins && data.data.plugins.memory_engine) || {};
      var el = document.getElementById('mem-stats');
      if (!el) return;
      var sc = function (v, l) {
        return '<div class="cd" style="text-align:center">' +
          '<div style="font-size:22px;font-weight:700;color:var(--accent)">' + (v || 0) + '</div>' +
          '<div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-top:2px">' + l + '</div></div>';
      };
      el.innerHTML =
        sc(s.memories_total, '{{ _("Total Memories") }}') +
        sc(s.reflexions_total, '{{ _("Reflexions") }}') +
        sc(s.injections_today, '{{ _("Injections Today") }}') +
        sc(s.evolution_suggestions, '{{ _("Suggestions") }}');
      var hint = document.getElementById('mem-hint');
      if (hint) {
        hint.innerHTML = (s.memories_total || 0)
          ? '✅ {{ _("Memory system is active.") }}'
          : 'ℹ️ {{ _("No memories yet. Memories are extracted automatically after agent tasks complete.") }}';
      }
    })
    .catch(function (e) {
      var el = document.getElementById('mem-stats');
      if (el) el.innerHTML = '<div class="em">{{ _("Failed to load memory data") }}: ' + esc(e.message) + '</div>';
    });
};

window.__memLoad = function () {
  var q = (document.getElementById('mem-search') || {}).value || '';
  fetch('/admin/memory/memories?q=' + encodeURIComponent(q),
    { headers: { 'Authorization': 'Bearer ' + T } })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var tb = document.querySelector('#mem-table tbody');
      if (!tb) return;
      if (!data.ok) {
        tb.innerHTML = '<tr><td colspan="5" class="em">' + esc(data.error || '{{ _("Failed to load memory data") }}') + '</td></tr>';
        return;
      }
      var rows = data.rows || [];
      tb.innerHTML = '';
      if (!rows.length) {
        tb.innerHTML = '<tr><td colspan="5" class="em">{{ _("No memories yet. Memories are extracted automatically after agent tasks complete.") }}</td></tr>';
        return;
      }
      rows.forEach(function (m) {
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + esc(m.memory_type) + '</td>' +
          '<td>' + esc(String(m.content).slice(0, 120)) + '</td>' +
          '<td>' + esc(m.owner_id || '-') + '</td>' +
          '<td>' + esc(Number(m.quality_score || 0).toFixed(2)) + '</td>' +
          '<td><button class="btn" style="background:var(--danger);color:#fff" onclick="window.__memDel(\'' +
          m.id + '\')">{{ _("Delete") }}</button></td>';
        tb.appendChild(tr);
      });
    })
    .catch(function (e) {
      var tb = document.querySelector('#mem-table tbody');
      if (tb) tb.innerHTML = '<tr><td colspan="5" class="em">{{ _("Failed to load memory data") }}: ' + esc(e.message) + '</td></tr>';
    });
};

window.__memDel = function (id) {
  fetch('/admin/memory/memories/' + id, {
    method: 'DELETE',
    headers: { 'Authorization': 'Bearer ' + T }
  })
    .then(function (r) { return r.json(); })
    .then(function () { window.__memLoad(); })
    .catch(function (e) { console.error('Memory delete failed:', e); });
};
