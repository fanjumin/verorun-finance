<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>抖音登录 — TradeMind</title><link rel="stylesheet" href="/admin/static/css/design-system.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}.card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:40px;max-width:400px;width:100%;text-align:center;animation:fadeUp .4s ease-out}.qr-box{width:220px;height:220px;margin:24px auto;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}.qr-box .stub-qr{width:180px;height:180px;background:linear-gradient(135deg,#1e1e1e,#444);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-size:48px}.qr-box .stub-qr .sub{font-size:14px;margin-top:8px;opacity:.9}h2{color:var(--text);font-size:20px;margin-bottom:6px}p{color:var(--text-muted);font-size:14px;margin-bottom:8px;line-height:1.6}.steps{text-align:left;margin:20px 0;padding:16px;background:var(--bg);border-radius:10px;counter-reset:step}.steps li{padding:6px 0;font-size:13px;color:var(--text-muted);list-style:none;counter-increment:step}.steps li::before{content:counter(step);display:inline-block;width:22px;height:22px;background:var(--dy);color:#fff;border-radius:50%;text-align:center;line-height:22px;font-size:12px;font-weight:700;margin-right:10px}.status-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;padding:12px;border-radius:8px;font-size:14px}.status-bar.waiting{background:rgba(88,166,255,.1);color:var(--accent)}.status-bar.done{background:rgba(63,185,80,.1);color:var(--success)}.status-bar.error{background:rgba(248,81,73,.1);color:var(--danger)}.spinner{width:18px;height:18px;border:2px solid rgba(88,166,255,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;border:none;transition:all .2s;font-family:inherit}.btn-dy{background:var(--dy);color:#fff}.btn-dy:hover{background:#333}.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-outline:hover{background:var(--bg)}.footer{margin-top:20px;font-size:12px;color:var(--text-dim)}.footer a{color:var(--text-muted);text-decoration:none}.footer a:hover{color:var(--accent)}@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:480px){.card{padding:24px 20px}.qr-box{width:180px;height:180px}}</style></head><body><div class="card"><div class="qr-box"><div class="stub-qr">&#127916;<div class="sub">抖音扫码</div></div></div><h2>抖音扫码登录</h2><p>使用抖音扫描二维码即可安全登录<br>TradeMind 智能选股平台</p><ol class="steps"><li>打开抖音「扫一扫」</li><li>扫描屏幕上的二维码</li><li>在手机上确认登录</li><li>自动跳转到控制台</li></ol><div class="status-bar waiting" id="statusBar"><div class="spinner"></div><span id="statusText">等待扫码...</span></div><div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><a href="/auth/douyin/qr" class="btn btn-dy">&#9889; 重新扫码</a><a href="/login" class="btn btn-outline">&#8592; 返回</a></div></div><div class="footer"><p>登录即表示同意 <a href="#">{{ _('Terms of Service') }}</a></p></div><script>const p=new URLSearchParams(window.location.search),e=p.get("error");if(e){document.getElementById("statusBar").className="status-bar error";document.getElementById("statusText").textContent="登录失败: "+decodeURIComponent(e)}else{setTimeout(function(){document.getElementById("statusBar").className="status-bar done";document.getElementById("statusText").textContent="扫码成功，正在登录...";window.location.href="/auth/douyin/callback?code=stub_"+Date.now()},2000)}</script></body></html>
