// Payment Management — 支付管理插件面板
// 无 <script> 标签，遵循插件模板铁律 §12.11
// 支持 8 个支付渠道，管理面板全部可见（不按市场隐藏）
// V20260819: 继承系统样式——移除动态 <style> 注入，自造 .pay-* 类替换为系统 .cd/.in/.ta/.sl/.btn/.bdg/.em 与 var() 主题变量

var _payProviders = {};
var _payConfigs = {};
var _payMarket = 'cn';

window.l_payment = function(){
  document.getElementById("pt").textContent = "{{ _('payment_management') }}";
  var mc = document.getElementById("mc");
  mc.innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">'+
      '<strong style="font-size:16px">{{ _('payment_config') }}</strong>'+
      '<span class="bdg" id="payMarketTag" style="background:rgba(0,255,159,.12);color:var(--accent3)">ALL</span>'+
    '</div>'+
    '<div id="payProviderGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px">'+
      '<div class="em" style="grid-column:1/-1"><div class="s" style="display:inline-block"></div> {{ _('Loading...') }}</div>'+
    '</div>';
  loadPayProviders();
};

function payShowError(msg){
  var grid = document.getElementById('payProviderGrid');
  if(grid) grid.textContent = '[Error] ' + msg;
  grid.style.color = 'var(--danger)';
  console.error('[PaymentPlugin]', msg);
}

function loadPayProviders(){
  fetch('/admin/payment/providers?market=all', {headers:{"Authorization":"Bearer "+T}})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(d){
      if(!d.success){payShowError(d.error||'{{ _("Load failed") }}');showToast(d.error||'{{ _("Load failed") }}','error');return}
      _payProviders = d.data || {};
      loadPayConfigs();
    })
    .catch(function(e){payShowError(e.message||'{{ _("Request Failed") }}');showToast(e.message||'{{ _("Request Failed") }}','error')});
}

function loadPayConfigs(){
  fetch('/admin/payment/configs', {headers:{"Authorization":"Bearer "+T}})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(d){
      if(!d.success){payShowError(d.error||'{{ _("Load failed") }}');showToast(d.error||'{{ _("Load failed") }}','error');return}
      var map = {};
      (d.data||[]).forEach(function(item){map[item.provider] = item.configs || {};});
      _payConfigs = map;
      // 取消市场隐藏：直接渲染全部 8 个渠道
      renderPayCards();
    })
    .catch(function(e){payShowError(e.message||'{{ _("Request Failed") }}');showToast(e.message||'{{ _("Request Failed") }}','error')});
}

function renderPayCards(){
  var grid = document.getElementById('payProviderGrid');
  if(!grid) return;
  var keys = Object.keys(_payProviders);
  if(!keys.length){
    grid.innerHTML = '<div class="em" style="grid-column:1/-1">{{ _("No payment providers available") }}</div>';
    return;
  }

  var h = '';
  keys.forEach(function(provider){
    var info = _payProviders[provider];
    var cfg = _payConfigs[provider] || {};
    var label = _payMarket === 'cn' ? (info.label_zh || info.label) : info.label;
    var fields = info.fields || [];
    var configured = fields.filter(function(f){return f.type==='password'||f.type==='text'}).every(function(f){return cfg[f.key] && cfg[f.key].length > 0});
    var fieldCount = fields.filter(function(f){return cfg[f.key] && cfg[f.key].length > 0}).length;

    h += '<div class="cd" data-provider="' + esc(provider) + '" style="padding:0;overflow:hidden">';
    h += '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);cursor:pointer;user-select:none" onclick="payToggleCard(this)">';
    h += '<div style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--text)"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + (configured ? 'var(--accent3)' : 'var(--dim)') + '"></span>' + esc(label) + '<span class="bdg" style="background:' + (configured ? 'rgba(0,255,159,.12)' : 'rgba(255,255,255,.06)') + ';color:' + (configured ? 'var(--accent3)' : 'var(--muted)') + '">' + fieldCount + '/' + fields.length + '</span></div>';
    h += '<div style="display:flex;align-items:center;gap:8px">';
    h += '<button class="btn bo bs" onclick="event.stopPropagation();payClearConfig(\'' + esc(provider) + '\')">{{ _("Clear") }}</button>';
    h += '<span style="color:var(--muted);font-size:16px">&#9662;</span>';
    h += '</div></div>';
    h += '<div style="display:none">';

    fields.forEach(function(f){
      var val = cfg[f.key] || '';
      var fLabel = _payMarket === 'cn' ? (f.label_zh || f.label) : f.label;
      h += '<div style="margin:14px 16px">';
      h += '<label for="pf-' + esc(provider) + '-' + esc(f.key) + '" style="display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px">' + esc(fLabel) + '</label>';
      if(f.type === 'password'){
        h += '<input id="pf-' + esc(provider) + '-' + esc(f.key) + '" type="password" class="in" style="width:100%;box-sizing:border-box" value="' + esc(val) + '" placeholder="' + (val ? '{{ _("Configured, leave empty to keep") }}' : '{{ _("Required") }}') + '" />';
      } else if(f.type === 'textarea'){
        h += '<textarea id="pf-' + esc(provider) + '-' + esc(f.key) + '" class="ta" style="min-height:60px;font-family:monospace;box-sizing:border-box" placeholder="' + esc(fLabel) + '">' + esc(val) + '</textarea>';
      } else if(f.type === 'checkbox'){
        h += '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text)"><input id="pf-' + esc(provider) + '-' + esc(f.key) + '" type="checkbox" ' + (val === 'true' || val === '1' ? 'checked' : '') + ' style="width:auto" /> ' + fLabel + '</label>';
      } else if(f.type === 'select' && f.options){
        h += '<select id="pf-' + esc(provider) + '-' + esc(f.key) + '" class="sl" style="width:100%;box-sizing:border-box">';
        f.options.forEach(function(opt){
          var optLabel = _payMarket === 'cn' ? (opt.label_zh || opt.label) : opt.label;
          h += '<option value="' + esc(opt.value) + '" ' + ((val||f.default) === opt.value ? 'selected' : '') + '>' + esc(optLabel) + '</option>';
        });
        h += '</select>';
      } else {
        h += '<input id="pf-' + esc(provider) + '-' + esc(f.key) + '" type="text" class="in" style="width:100%;box-sizing:border-box" value="' + esc(val) + '" placeholder="' + esc(fLabel) + '" />';
      }
      if(f.hint){
        var hintTxt = _payMarket === 'cn' ? (f.hint_zh || f.hint) : f.hint;
        if(hintTxt) h += '<div style="font-size:11px;color:var(--dim);margin-top:3px">' + esc(hintTxt) + '</div>';
      }
      h += '</div>';
    });

    h += '<div style="padding:12px 16px;border-top:1px solid var(--border)"><button class="btn bp" onclick="paySaveConfig(\'' + esc(provider) + '\')" id="paySaveBtn-' + esc(provider) + '">{{ _("save") }}</button></div>';
    h += '</div></div>';
  });

  grid.innerHTML = h;
  var tag = document.getElementById('payMarketTag');
  if(tag){
    tag.textContent = 'ALL';
    tag.style.background = 'rgba(0,255,159,.12)';
    tag.style.color = 'var(--accent3)';
  }
}

window.payToggleCard = function(header){
  var body = header.nextElementSibling;
  if(!body) return;
  body.style.display = (body.style.display === 'block') ? 'none' : 'block';
};

window.paySaveConfig = function(provider){
  var btn = document.getElementById('paySaveBtn-' + provider);
  if(!btn) return;
  btn.disabled = true; btn.textContent = '{{ _("Saving...") }}'; btn.className = 'btn bp'; btn.style.opacity = '0.5';

  var info = _payProviders[provider];
  if(!info) return;
  var configs = {};
  (info.fields||[]).forEach(function(f){
    var el = document.getElementById('pf-' + provider + '-' + f.key);
    if(!el) return;
    var val;
    if(f.type === 'checkbox'){
      val = el.checked ? 'true' : '';
    } else {
      val = el.value.trim();
    }
    if(val) configs[f.key] = val;
  });

  fetch('/admin/payment/configs/' + provider, {
    method: 'PUT',
    headers: {'Authorization':'Bearer '+T, 'Content-Type':'application/json'},
    body: JSON.stringify({configs: configs})
  }).then(function(r){return r.json()}).then(function(d){
    if(d.success){showToast('{{ _("save_success") }}'); loadPayConfigs(); return; }
    showToast(d.error||'{{ _("save_failed") }}','error');
    btn.disabled = false; btn.textContent = '{{ _("save") }}'; btn.className = 'btn bp'; btn.style.opacity = '';
  }).catch(function(){
    showToast('{{ _("save_failed") }}','error');
    btn.disabled = false; btn.textContent = '{{ _("save") }}'; btn.className = 'btn bp'; btn.style.opacity = '';
  });
};

window.payClearConfig = function(provider){
  if(!confirm('{{ _("Clear all") }} ' + provider + ' {{ _("configuration?") }}')) return;
  fetch('/admin/payment/configs/' + provider, {
    method: 'DELETE',
    headers: {'Authorization':'Bearer '+T}
  }).then(function(r){return r.json()}).then(function(d){
    if(d.success){showToast('{{ _("Cleared") }}'); loadPayConfigs(); return; }
    showToast(d.error||'{{ _("Failed") }}','error');
  });
};
