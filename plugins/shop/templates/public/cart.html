<!DOCTYPE html>

<html lang="{{ lang }}">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>{{ _('Cart') }} — {{ brand.site_name_cn if brand else '' }}</title>
<link href="{{ brand.favicon_url if brand and brand.favicon_url else '/static/favicon-32x32.png' }}" rel="icon" sizes="32x32" type="image/png"/>
<link href="/static/css/landing.css" rel="stylesheet"/>
<style>
body{background:var(--bg);color:var(--text);font-family:var(--font-cn)}
.cart-hero{text-align:center;padding:120px 32px 24px}
.cart-hero h1{font-size:clamp(1.5em,3vw,2em);font-weight:800;color:var(--text-high)}
.cart-wrap{max-width:800px;margin:0 auto;padding:0 24px 80px}
.cart-item{display:flex;align-items:center;gap:16px;background:var(--bg-glass);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:10px;transition:all .2s}
.cart-item:hover{border-color:var(--border-accent)}
.cart-item .thumb{width:60px;height:60px;border-radius:8px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px}
.cart-item .thumb img{width:60px;height:60px;object-fit:cover;border-radius:8px}
.cart-item .info{flex:1}
.cart-item .info .title{font-size:14px;font-weight:600;color:var(--text)}
.cart-item .info .price{font-size:13px;color:var(--accent);margin-top:2px}
.cart-item .qty{display:flex;align-items:center;gap:6px}
.cart-item .qty button{width:28px;height:28px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text);cursor:pointer;font-size:14px}
.cart-item .qty span{min-width:24px;text-align:center;font-size:14px;font-weight:600}
.cart-item .subtotal{font-size:15px;font-weight:700;color:var(--accent);min-width:80px;text-align:right}
.cart-item .remove-btn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;padding:4px}
.cart-item .remove-btn:hover{color:#f85149}
.cart-summary{background:var(--bg-glass);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:16px;display:flex;align-items:center;justify-content:space-between}
.cart-summary .total-text{font-size:14px;color:var(--text-dim)}
.cart-summary .total-amount{font-size:24px;font-weight:800;color:var(--accent);font-family:var(--font-display)}
.cart-summary .checkout-btn{padding:12px 32px;border:none;border-radius:10px;background:var(--indigo);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-cn)}
.cart-summary .checkout-btn:hover{box-shadow:0 4px 16px rgba(99,102,241,.3)}
.empty-state{text-align:center;padding:120px 32px;color:var(--dim)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state a{color:var(--accent);text-decoration:none}
.toast{position:fixed;top:20px;right:20px;z-index:9999;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;max-width:320px;animation:slideIn .3s}
.toast.success{background:rgba(0,255,159,.15);border:1px solid var(--accent3);color:var(--accent3)}
.toast.error{background:rgba(248,81,73,.15);border:1px solid #f85149;color:#f85149}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}}
</style>
</head>
<body>
<div id="particles-bg"></div>
{% include '_header.html' ignore missing %}
<div class="cart-hero"><h1>{{ _('🛒 Cart') }}</h1></div>
<div class="cart-wrap" id="cartContent">
<div style="text-align:center;padding:120px;color:var(--dim)"><div class="s"></div></div>
</div>

<script>
var T = '{{ token or "" }}';

// ── Address selection ──
var _addresses = [];
var _selectedAddr = null;

function loadAddresses(){
  if(!T) return;
  fetch("/shop/api/addresses",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success) return;
    _addresses = d.data.addresses || [];
    _selectedAddr = d.data.default || (_addresses.length ? _addresses[0] : null);
  });
}

function showAddressPicker(cb){
  if(!_addresses.length){
    showToast("Please add a shipping address in your profile first","error");
    return;
  }
  var opts = _addresses.map(function(a,i){
    var sel = _selectedAddr && _selectedAddr.id===a.id && _selectedAddr.type===a.type ? ' selected' : '';
    return '<option value="'+i+'"'+sel+'>'+esc(a.recipient_name)+' — '+esc(a.address)+' ('+esc(a.phone)+')</option>';
  }).join('');
  var picker = document.createElement("div");
  picker.id="addrPicker";
  picker.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center';
  picker.innerHTML='<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:500px;width:90%">'+
    '<h3 style="margin:0 0 12px;font-size:16px;font-weight:700;color:var(--text)">Select Shipping Address</h3>'+
    '<select id="addrSelect" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;margin-bottom:16px">'+opts+'</select>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end">'+
    '<button onclick="this.closest(\'#addrPicker\').remove()" style="padding:8px 20px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);cursor:pointer">Cancel</button>'+
    '<button id="addrConfirmBtn" style="padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-weight:600">Confirm</button></div></div>';
  document.body.appendChild(picker);
  document.getElementById("addrConfirmBtn").onclick=function(){
    var idx = parseInt(document.getElementById("addrSelect").value);
    _selectedAddr = _addresses[idx];
    picker.remove();
    if(cb) cb(_selectedAddr);
  };
}

function checkout(){
  if(!_addresses.length){
    showToast("Please add a shipping address in your profile first","error");
    return;
  }
  showAddressPicker(function(addr){
    var body = JSON.stringify({address_id: addr.id, address_type: addr.type});
    fetch("/shop/api/checkout",{method:"POST",headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"},body:body})
      .then(function(r){return r.json()}).then(function(d){
        if(d.success){showToast("Order created, proceed to payment","success");setTimeout(function(){location.href="/shop/orders"},1000)}
        else showToast(d.error||"Checkout failed","error");
      });
  });
}
function loadCart(){
  var headers = T ? {"Authorization":"Bearer "+T} : {};
  fetch("/shop/api/cart",{headers:headers}).then(function(r){return r.json()}).then(function(d){
    if(!d.success)return;
    var cart=d.data, items=cart.items||[], h="";
    if(!items.length){h='<div class="empty-state"><div class="icon">🛒</div><div>{{ _('Your cart is empty') }}</div><a href="/shop" style="color:var(--accent);margin-top:12px;display:inline-block">→ {{ _('Go Shopping') }}</a></div>'}
    else{
      items.forEach(function(it){
        var cid = typeof it.id==='number' ? it.id : "'"+String(it.id).replace(/'/g,"\\'")+"'";
        h+='<div class="cart-item" id="ci-'+it.id+'">';
        h+='<div class="thumb">'+(it.thumbnail?'<img src="'+it.thumbnail+'" alt="">':'🛒')+'</div>';
        h+='<div class="info"><div class="title">'+esc(it.title||it.product_title)+'</div>';
        h+='<div class="price">¥'+it.price+'</div></div>';
        h+='<div class="qty"><button onclick="updateQty('+cid+','+(it.quantity-1)+')">−</button>';
        h+='<span>'+it.quantity+'</span><button onclick="updateQty('+cid+','+(it.quantity+1)+')">+</button></div>';
        h+='<div class="subtotal">¥'+(it.subtotal||(it.price*it.quantity).toFixed(2))+'</div>';
        h+='<button class="remove-btn" onclick="removeItem('+cid+')">✕</button></div>';
      });
      h+='<div class="cart-summary"><div><div class="total-text">{{ _('Total') }}</div><div class="total-amount">¥'+(cart.total||'0.00')+'</div></div>';
      h+='<button class="checkout-btn" onclick="'+(T?'checkout()':'loginToCheckout()')+'">{{ _('Checkout') }}</button></div>';
    }
    document.getElementById("cartContent").innerHTML=h;
  });
}

function updateQty(cid,qty){
  if(qty<1)return;
  var headers = T ? {"Authorization":"Bearer "+T,"Content-Type":"application/json"} : {"Content-Type":"application/json"};
  fetch("/shop/api/cart/update",{method:"POST",headers:headers,body:JSON.stringify({cart_id:cid,quantity:qty})})
    .then(function(r){return r.json()}).then(function(d){if(d.success)loadCart()});
}
function removeItem(cid){
  var headers = T ? {"Authorization":"Bearer "+T,"Content-Type":"application/json"} : {"Content-Type":"application/json"};
  fetch("/shop/api/cart/remove",{method:"POST",headers:headers,body:JSON.stringify({cart_id:cid})})
    .then(function(r){return r.json()}).then(function(d){if(d.success)loadCart()});
}
function loginToCheckout(){
  location.href="/login?redirect=/shop/cart";
}
function showToast(msg,type){
  var el=document.createElement("div");el.className="toast "+type;el.textContent=msg;
  document.body.appendChild(el);setTimeout(function(){el.style.opacity="0";setTimeout(function(){el.remove()},300)},3000);
}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

if(typeof tsParticles!=='undefined'){
  tsParticles.load('particles-bg',{
    fullScreen:{enable:false,zIndex:0},fpsLimit:40,
    particles:{number:{value:40,density:{enable:true,area:800}},
    color:{value:['#00f5ff','#a020f0','#6366f1','#00ff9f']},
    shape:{type:'circle'},opacity:{value:.2,random:true},
    size:{value:{min:1,max:3},random:true},
    links:{enable:true,distance:150,color:'#6366f1',opacity:.08,width:1},
    move:{enable:true,speed:.5},background:{color:'transparent'}
  });
}
loadCart();
loadAddresses();
</script>
</body>
</html>
