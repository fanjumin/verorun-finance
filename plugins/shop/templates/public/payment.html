<!DOCTYPE html>

<html lang="{{ lang }}">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>{{ _('Order Payment') }} — {{ brand.site_name_cn if brand else '' }}</title>
<link href="{{ brand.favicon_url if brand and brand.favicon_url else '/static/favicon-32x32.png' }}" rel="icon" sizes="32x32" type="image/png"/>
<link href="/static/css/landing.css" rel="stylesheet"/>
<style>
body{background:var(--bg);color:var(--text);font-family:var(--font-cn)}
.pay-wrap{max-width:500px;margin:0 auto;padding:120px 24px 60px}
.pay-card{background:var(--bg-glass);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:20px;padding:32px}
.pay-card .icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px}
.pay-card h1{font-size:20px;font-weight:700;text-align:center;margin:0 0 4px}
.pay-card .sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px}
.pay-card .field{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.pay-card .field .label{color:var(--muted)}
.pay-card .field .value{font-weight:600}
.pay-card .amount{text-align:center;margin:24px 0;font-size:42px;font-weight:800;color:var(--accent);font-family:var(--font-display)}
.pay-card .amount .sym{font-size:22px;vertical-align:super}
.pay-card .actions{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.pay-card .actions .btn{padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font-cn);transition:all .2s;text-align:center}
.btn-pay{background:var(--indigo);color:#fff}
.btn-pay:hover{box-shadow:0 4px 20px rgba(99,102,241,.35)}
.btn-pay:disabled{opacity:.5;cursor:not-allowed}
.btn-back{background:var(--bg-glass);border:1px solid var(--border);color:var(--text)}
.status-msg{margin-top:16px;padding:12px;border-radius:8px;font-size:13px;text-align:center;display:none}
.status-msg.error{display:block;background:rgba(239,68,68,.1);color:var(--rose);border:1px solid rgba(239,68,68,.2)}
.status-msg.success{display:block;background:rgba(0,255,159,.1);color:var(--green);border:1px solid rgba(0,255,159,.2)}
.status-msg.info{display:block;background:rgba(99,102,241,.1);color:var(--indigo);border:1px solid rgba(99,102,241,.2)}
</style>
</head>
<body>
<div id="particles-bg"></div>
{% include '_header.html' ignore missing %}
<div class="pay-wrap">
<div class="pay-card">
<div class="icon" style="background:var(--indigo);color:#fff">🛒</div>
<h1>{{ _('Order Payment') }}</h1>
<p class="sub" id="orderDisplay">{{ _('Order:') }}{{ order_id }}</p>
<div class="field"><span class="label">{{ _('Order ID') }}</span><span class="value" id="oid">{{ order_id }}</span></div>
<div class="field"><span class="label">{{ _('Product Name') }}</span><span class="value" id="productTitle">{{ _('Loading...') }}</span></div>
<div class="field"><span class="label">{{ _('Status') }}</span><span class="value" id="orderStatus">-</span></div>
<div class="amount"><span class="sym">¥</span><span id="payAmount">--</span></div>
<div class="actions">
<button class="btn btn-pay" id="payBtn" onclick="doPay()">{{ _('Pay Now') }}</button>
<button class="btn btn-back" onclick="history.back()">{{ _('Back to Edit') }}</button>
</div>
<div class="status-msg" id="statusMsg"></div>
</div>
</div>

<script src="{{ url_for('shop_public.static', filename='js/tsparticles.bundle.min.js') }}"></script>
<script>
var OID = '{{ order_id }}';
var T = '{{ token or "" }}';
if(!T){T=localStorage.getItem('sso_token')||localStorage.getItem('tm_token')||localStorage.getItem('token')||''}

function showStatus(msg,type){
  var el=document.getElementById('statusMsg');
  el.textContent=msg;el.className='status-msg '+type;
}

// 加载订单信息
function loadOrder(){
  fetch('/shop/api/orders',{headers:{'Authorization':'Bearer '+T}})
    .then(function(r){return r.json()})
    .then(function(d){
      if(!d.success)return;
      var order=null;
      (d.data||[]).forEach(function(o){if(o.order_id===OID)order=o});
      if(!order){showStatus('{{ _('Order does not exist') }}','error');return}
      document.getElementById('productTitle').textContent=order.product_title||'{{ _('Product') }}';
      document.getElementById('orderStatus').textContent=order.status=='pending'?'{{ _('Pending Payment') }}':'{{ _('Paid') }}';
      document.getElementById('payAmount').textContent=parseFloat(order.total||0).toFixed(2);
    });
}

// 发起支付
function doPay(){
  var btn=document.getElementById('payBtn');
  btn.disabled=true;btn.textContent='{{ _('Processing...') }}';
  showStatus('{{ _('Creating payment...') }}','info');
  fetch('/shop/api/pay/'+OID,{
    method:'POST',
    headers:{'Authorization':'Bearer '+T,'Content-Type':'application/json'},
    body:JSON.stringify({method:'alipay'})
  }).then(function(r){
    if(!r.ok)return r.json().then(function(e){throw new Error(e.error||'{{ _('Request failed') }}')});
    return r.json();
  }).then(function(d){
    if(d.success&&d.data&&d.data.qr_code){
      // 支付宝: 扫码支付
      showStatus('{{ _('Please scan with Alipay to pay') }}','info');
      btn.style.display='none';
      var qrHtml='<div style="text-align:center;margin-top:12px">'
        +'<img src="/shop/qr?data='+encodeURIComponent(d.data.qr_code)+'" alt="QR" style="width:200px;height:200px;background:#fff;padding:8px;border-radius:8px">'
        +'<div style="font-size:12px;color:var(--muted);margin-top:10px">⏳ {{ _('Payment successful, auto-confirming...') }}</div></div>';
      document.getElementById('payAmount').insertAdjacentHTML('afterend', qrHtml);
      pollPayStatus();
    }else if(d.success&&d.data&&d.data.pay_url){
      showStatus('{{ _('Redirecting to Alipay...') }}','success');
      window.location.href=d.data.pay_url;
    }else if(d.success&&d.data&&d.data.stub){
      showStatus('⚠️ {{ _('Payment system test mode') }}','info');
      btn.disabled=false;btn.textContent='{{ _('Pay Now') }}';
    }else{
      throw new Error(d.error||'{{ _('Payment creation failed') }}');
    }
  }).catch(function(err){
    showStatus(err.message||'{{ _('Payment service error') }}','error');
    btn.disabled=false;btn.textContent='{{ _('Pay Now') }}';
  });
}

// 轮询支付状态
function pollPayStatus(){
  var timer=setInterval(function(){
    fetch('/shop/api/pay/status/'+OID,{headers:{'Authorization':'Bearer '+T}})
      .then(function(r){return r.json()})
      .then(function(d){
        if(d.success&&d.data&&d.data.status==='paid'){
          clearInterval(timer);
          showStatus('✅ {{ _('Payment successful') }}','success');
          setTimeout(function(){window.location.reload()},1200);
        }
      });
  },3000);
  setTimeout(function(){clearInterval(timer)},180000);
}

// tsParticles
if(typeof tsParticles!=='undefined'){
  tsParticles.load('particles-bg',{
    fullScreen:{enable:false,zIndex:0},fpsLimit:40,
    particles:{number:{value:40,density:{enable:true,area:800}},
    color:{value:['#00f5ff','#a020f0','#6366f1','#00ff9f']},
    shape:{type:'circle'},opacity:{value:.2,random:true},
    size:{value:{min:1,max:3},random:true},
    links:{enable:true,distance:150,color:'#6366f1',opacity:.08,width:1},
    move:{enable:true,speed:.5,direction:'none',random:true,outModes:{default:'bounce'}}},
    background:{color:'transparent'}
  });
}

loadOrder();
</script>
</body>
</html>
