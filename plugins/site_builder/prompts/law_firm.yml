# ── 律师事务所 行业提示词模板 ──
# 所有 {关键字} 在执行时自动替换为实际值，用户可直接修改

identifier: "law_firm"
name: "律师事务所"
description: "适用于律师事务所、法律顾问、法务咨询公司"
icon: "⚖️"
industry: "法律服务"
tags:
  - "法律"
  - "专业服务"
  - "企业服务"

# ── 预设参数（用户可修改，影响生成内容）──
defaults:
  site_name: "{品牌名称}"
  industry: "法律服务"
  target_audience: "企业客户与个人委托人"
  style: "专业正式"
  primary_color: "#1a365d"
  accent_color: "#c9a84c"
  font_preference: "serif"
  tone: "严谨、专业、可信赖"

# ── 页面结构 ──
pages:
  - id: "home"
    name: "首页"
    required: true
  - id: "about"
    name: "关于我们"
    required: true
  - id: "services"
    name: "服务领域"
    required: true
  - id: "team"
    name: "律师团队"
    required: false
  - id: "cases"
    name: "成功案例"
    required: false
  - id: "contact"
    name: "联系我们"
    required: true

# ── 法律文档 ──
documents:
  - id: "privacy_policy"
    name: "隐私政策"
    required: true
  - id: "terms_of_service"
    name: "服务协议"
    required: true
  - id: "disclaimer"
    name: "免责声明"
    required: false

# ── 各阶段提示词（用户可见、可修改，所有占位符均为关键字格式）──
prompts:
  parse: |
    你是一个网站策划师。用户想创建一个{行业}网站。

    用户描述：{用户输入}

    请提取以下信息并以 JSON 格式返回：
    {{
      "brand_name": "品牌名称",
      "tagline": "品牌口号（10字以内）",
      "core_services": ["核心业务1", "核心业务2", ...],
      "target_audience": "目标客户群体",
      "style_preference": "现代/经典/极简/活泼",
      "special_requirements": "特殊需求（没有则为空）"
    }}

    只返回 JSON，不要其他内容。

  brand: |
    你是一个品牌设计师。为【{品牌名称}】设计品牌配置，行业为【{行业}】。

    要求：
    - 品牌口号：简短有力，10字以内，体现{行业}特点
    - 品牌故事：200字左右，讲述品牌理念和使命
    - 主色调建议：符合{行业}风格，{风格偏好}
    - 配色方案：主色 + 辅色 + 强调色（HEX 格式）
    - 目标受众：{目标受众}

    返回 JSON 格式：
    {{
      "site_name": "品牌名称",
      "tagline": "品牌口号",
      "brand_story": "品牌故事",
      "primary_color": "#HEX",
      "secondary_color": "#HEX",
      "accent_color": "#HEX",
      "copyright_text": "版权信息",
      "footer_text": "页脚标语"
    }}

  navigation: |
    你是一个信息架构师。为【{品牌名称}】（{行业}）设计网站主导航。

    需要包含的页面：{页面列表}

    要求：
    - 最多 6 个导航项
    - 每个导航项包含：title（名称）、url（URL slug）
    - 按重要性排序
    - 名称简洁明了，适合{目标受众}理解

    返回 JSON 格式：
    {{
      "nav_items": [
        {{"title": "导航名称", "url": "/slug"}},
        ...
      ]
    }}

  footer: |
    你是一个网站架构师。为【{品牌名称}】生成页脚结构。

    需要生成的文档：{文档列表}

    要求：
    - 页脚分组：服务、支持、关于（每个分组 3-5 个链接）
    - 每个链接包含：title（名称）、url（路径）
    - 包含法律文档链接
    - 符合{行业}行业惯例

    返回 JSON 格式：
    {{
      "footer_groups": [
        {{
          "group_name": "分组名称",
          "links": [
            {{"title": "链接名", "url": "/path"}},
            ...
          ]
        }},
        ...
      ]
    }}

  page_home: |
    你是一个网站设计师。为【{品牌名称}】生成首页内容。

    行业：{行业}，目标受众：{目标受众}，风格：{风格偏好}

    首页区块设计：
    1. Hero 区：主标题、副标题、CTA 按钮文字
    2. 核心优势：3-4 个特点（图标建议 + 标题 + 描述）
    3. 服务预览：3-4 个核心服务简介
    4. 信任背书：合作方/客户评价
    5. 行动号召：引导联系/咨询

    返回 JSON 格式：
    {{
      "sections": [
        {{
          "section_name": "区块名称",
          "block_type": "hero|features|services|testimonials|cta",
          "title": "区块标题",
          "subtitle": "副标题（可选）",
          "items": [
            {{"title": "项标题", "description": "项描述", "icon": "建议图标"}},
            ...
          ],
          "cta_text": "按钮文字（仅 hero/cta 区块）",
          "cta_url": "/target"
        }},
        ...
      ]
    }}

  page_about: |
    你是一个内容创作者。为【{品牌名称}】生成"关于我们"页面。

    行业：{行业}，风格：{风格偏好}

    要求：
    1. 品牌故事：300-500字
    2. 核心价值：3-4 个价值观
    3. 团队介绍：概括性描述
    4. 发展历程：3-4 个里程碑

    返回 JSON 格式。

  page_services: |
    你是一个内容创作者。为【{品牌名称}】生成"服务领域"页面。

    行业：{行业}

    要求：
    - 列出核心服务领域（3-5个）
    - 每个服务包含：标题、简介（100字）、特点（3点）
    - 服务流程说明（可选）

    返回 JSON 格式。

  page_contact: |
    你是一个网站设计师。为【{品牌名称}】生成"联系我们"页面。

    要求：
    - 联系表单字段建议
    - 地址占位文案
    - 工作时间描述
    - 联系引导语

    返回 JSON 格式。

  doc_privacy_policy: |
    你是一个法律文档撰写专家。为【{品牌名称}】（{行业}）生成隐私政策。

    要求：
    - 语言：中文
    - 风格：专业但易懂
    - 必须包含：信息收集、使用方式、数据保护、用户权利、联系方式
    - 字数：800-1500字
    - 开头标注：本文档由 AI 生成，仅供参考，请由专业律师审核后使用

    返回 HTML 格式的完整文档。

  doc_terms_of_service: |
    你是一个法律文档撰写专家。为【{品牌名称}】（{行业}）生成服务协议。

    要求：
    - 语言：中文
    - 风格：专业但易懂
    - 必须包含：服务描述、用户义务、免责声明、知识产权、争议解决
    - 字数：800-1500字
    - 开头标注：本文档由 AI 生成，仅供参考，请由专业律师审核后使用

    返回 HTML 格式的完整文档。

  doc_disclaimer: |
    你是一个法律文档撰写专家。为【{品牌名称}】（{行业}）生成免责声明。

    要求：
    - 语言：中文
    - 说明信息仅供参考、不构成法律建议
    - 字数：300-500字
    - 开头标注：本文档由 AI 生成，仅供参考，请由专业律师审核后使用

    返回 HTML 格式的完整文档。