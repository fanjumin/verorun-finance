# ── 餐饮美食 行业提示词模板 ──

identifier: "restaurant"
name: "餐饮美食"
description: "适用于餐厅、咖啡馆、美食品牌"
icon: "🍽️"
industry: "餐饮"
tags:
  - "餐饮"
  - "美食"
  - "生活服务"

defaults:
  site_name: "{品牌名称}"
  industry: "餐饮美食"
  target_audience: "美食爱好者和本地食客"
  style: "温馨现代"
  primary_color: "#c0392b"
  accent_color: "#f39c12"
  font_preference: "sans-serif"
  tone: "温暖、诱人、有生活气息"

pages:
  - id: "home"
    name: "首页"
    required: true
  - id: "menu"
    name: "菜单"
    required: true
  - id: "about"
    name: "关于我们"
    required: true
  - id: "locations"
    name: "门店位置"
    required: false
  - id: "order"
    name: "在线订餐"
    required: false
  - id: "contact"
    name: "联系我们"
    required: true

documents:
  - id: "privacy_policy"
    name: "隐私政策"
    required: true
  - id: "terms_of_service"
    name: "服务协议"
    required: true

prompts:
  parse: |
    你是一个网站策划师。用户想创建一个{行业}网站。

    用户描述：{用户输入}

    请提取以下信息并以 JSON 格式返回：
    {{
      "brand_name": "品牌名称",
      "tagline": "品牌口号（10字以内）",
      "cuisine_type": "菜系/类型",
      "target_audience": "目标客户群体",
      "style_preference": "现代/经典/极简/活泼",
      "special_requirements": "特殊需求"
    }}
    只返回 JSON，不要其他内容。

  brand: |
    你是一个品牌设计师。为【{品牌名称}】设计品牌配置，行业为【{行业}】。

    要求：
    - 品牌口号：简短有力，突出美食特色
    - 品牌故事：200字左右，讲述品牌理念
    - 主色调：温暖诱人的配色方案
    - 风格：{风格偏好}

    返回 JSON 格式：
    {{
      "site_name": "品牌名称",
      "tagline": "品牌口号",
      "brand_story": "品牌故事",
      "primary_color": "#HEX",
      "secondary_color": "#HEX",
      "accent_color": "#HEX",
      "copyright_text": "版权信息",
      "footer_text": "页脚标语"
    }}

  navigation: |
    你是一个信息架构师。为【{品牌名称}】（{行业}）设计网站主导航。

    需要包含的页面：{页面列表}

    要求：最多 6 个导航项，简洁明了，适合{目标受众}理解。

    返回 JSON 格式。

  footer: |
    你是一个网站架构师。为【{品牌名称}】生成页脚结构。

    需要生成的文档：{文档列表}

    要求：页脚分组（菜单、服务、关于），符合{行业}行业惯例。

    返回 JSON 格式。

  page_home: |
    你是一个网站设计师。为【{品牌名称}】生成首页内容。

    行业：{行业}，风格：{风格偏好}

    首页区块设计：
    1. Hero 区：诱人的主标题、副标题、CTA 按钮
    2. 特色菜品：3-4 个招牌菜推荐
    3. 关于品牌：简短介绍
    4. 门店信息：地址和营业时间

    返回 JSON 格式。

  page_menu: |
    你是一个美食编辑。为【{品牌名称}】生成菜单页面。

    要求：
    - 按类别分组（前菜、主菜、甜品、饮品等）
    - 每个类别 3-5 个菜品
    - 每个菜品包含：名称、描述、价格范围

    返回 JSON 格式。

  page_about: |
    你是一个内容创作者。为【{品牌名称}】生成"关于我们"页面。

    要求：品牌故事、主厨/创始人介绍、品牌理念、发展历程。

    返回 JSON 格式。

  page_contact: |
    你是一个网站设计师。为【{品牌名称}】生成"联系我们"页面。

    要求：联系表单、地址、营业时间、订餐电话。

    返回 JSON 格式。

  doc_privacy_policy: |
    你是一个法律文档撰写专家。为【{品牌名称}】（{行业}）生成隐私政策。

    要求：中文，800-1500字，包含信息收集、使用方式、数据保护、用户权利、联系方式。
    开头标注：本文档由 AI 生成，仅供参考，请由专业律师审核后使用。

    返回 HTML 格式。

  doc_terms_of_service: |
    你是一个法律文档撰写专家。为【{品牌名称}】（{行业}）生成服务协议。

    要求：中文，800-1500字，包含服务描述、用户义务、免责声明、知识产权、争议解决。
    开头标注：本文档由 AI 生成，仅供参考，请由专业律师审核后使用。

    返回 HTML 格式。