# ── 科技公司 行业提示词模板 ──

identifier: "tech_company"
name: "科技公司"
description: "适用于科技创业公司、SaaS、互联网企业"
icon: "💻"
industry: "科技"
tags:
  - "科技"
  - "SaaS"
  - "互联网"
  - "创业"

defaults:
  site_name: "{品牌名称}"
  industry: "科技"
  target_audience: "企业客户和技术决策者"
  style: "现代极简"
  primary_color: "#2563eb"
  accent_color: "#7c3aed"
  font_preference: "sans-serif"
  tone: "创新、专业、有前瞻性"

pages:
  - id: "home"
    name: "首页"
    required: true
  - id: "products"
    name: "产品"
    required: true
  - id: "solutions"
    name: "解决方案"
    required: false
  - id: "about"
    name: "关于我们"
    required: true
  - id: "clients"
    name: "客户案例"
    required: false
  - id: "contact"
    name: "联系我们"
    required: true

documents:
  - id: "privacy_policy"
    name: "隐私政策"
    required: true
  - id: "terms_of_service"
    name: "服务协议"
    required: true
  - id: "cookie_policy"
    name: "Cookie 政策"
    required: false

prompts:
  parse: |
    你是一个网站策划师。用户想创建一个{行业}网站。

    用户描述：{用户输入}

    请提取以下信息并以 JSON 格式返回：
    {{
      "brand_name": "品牌名称",
      "tagline": "品牌口号（10字以内）",
      "core_products": ["核心产品/服务1", "核心产品/服务2", ...],
      "target_audience": "目标客户群体",
      "style_preference": "现代/经典/极简/活泼",
      "special_requirements": "特殊需求"
    }}
    只返回 JSON，不要其他内容。

  brand: |
    你是一个品牌设计师。为【{品牌名称}】设计品牌配置，行业为【{行业}】。

    要求：
    - 品牌口号：简洁有力，体现技术创新
    - 品牌故事：200字左右，讲述创业理念和愿景
    - 主色调：现代科技感配色（蓝紫渐变类）
    - 风格：{风格偏好}

    返回 JSON 格式：
    {{
      "site_name": "品牌名称",
      "tagline": "品牌口号",
      "brand_story": "品牌故事",
      "primary_color": "#HEX",
      "secondary_color": "#HEX",
      "accent_color": "#HEX",
      "copyright_text": "版权信息",
      "footer_text": "页脚标语"
    }}

  navigation: |
    你是一个信息架构师。为【{品牌名称}】（{行业}）设计网站主导航。

    需要包含的页面：{页面列表}

    返回 JSON 格式。

  footer: |
    你是一个网站架构师。为【{品牌名称}】生成页脚结构。

    需要生成的文档：{文档列表}

    返回 JSON 格式。

  page_home: |
    你是一个网站设计师。为【{品牌名称}】生成首页内容。

    行业：{行业}，风格：{风格偏好}

    首页区块设计：
    1. Hero 区：产品价值主张 + CTA
    2. 核心功能：3-4 个亮点
    3. 客户案例：知名客户 logo
    4. 数据/信任指标：用户数、好评率等

    返回 JSON 格式。

  page_products: |
    你是一个产品文案。为【{品牌名称}】生成产品/服务页面。

    要求：
    - 产品分类展示
    - 每个产品：名称、简介、核心功能（3点）、定价模式（可选）
    - 对比表格（可选）

    返回 JSON 格式。

  page_about: |
    你是一个内容创作者。为【{品牌名称}】生成"关于我们"页面。

    要求：公司愿景、团队介绍、技术实力、发展里程碑。

    返回 JSON 格式。

  page_contact: |
    你是一个网站设计师。为【{品牌名称}】生成"联系我们"页面。

    要求：联系表单、商务合作、技术支持、社交媒体链接。

    返回 JSON 格式。

  doc_privacy_policy: |
    你是一个法律文档撰写专家。为【{品牌名称}】（{行业}）生成隐私政策。

    要求：中文，800-1500字。必须包含数据收集、使用、存储、用户权利。特别关注 SaaS 服务的数据处理条款。
    开头标注：本文档由 AI 生成，仅供参考，请由专业律师审核后使用。

    返回 HTML 格式。

  doc_terms_of_service: |
    你是一个法律文档撰写专家。为【{品牌名称}】（{行业}）生成服务协议。

    要求：中文，800-1500字。包含 SaaS 服务条款、使用限制、付费条款、知识产权、免责声明。
    开头标注：本文档由 AI 生成，仅供参考，请由专业律师审核后使用。

    返回 HTML 格式。

  doc_cookie_policy: |
    你是一个法律文档撰写专家。为【{品牌名称}】（{行业}）生成 Cookie 政策。

    要求：中文，300-500字。说明网站使用的 Cookie 类型、目的、用户选择权。
    开头标注：本文档由 AI 生成，仅供参考，请由专业律师审核后使用。

    返回 HTML 格式。