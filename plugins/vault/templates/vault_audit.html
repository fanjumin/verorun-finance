<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Log — VeroRun Vault</title>
    <link rel="stylesheet" href="/admin/static/css/themes.css">
    <link rel="stylesheet" href="/admin/vault/static/vault.css">
</head>
<body>

<div class="vault-dashboard">

    {% include 'vault_nav.html' %}

    <div class="vault-page-header">
        <h2>{{ _('Audit Log') }}</h2>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>{{ _('Operation History') }}</h3>
            <div class="card-header-actions">
                <select id="auditActionFilter" class="filter-select">
                    <option value="">{{ _('All Actions') }}</option>
                    <option value="backup.full.create">{{ _('Backup Created') }}</option>
                    <option value="backup.delete">{{ _('Backup Deleted') }}</option>
                    <option value="restore.execute">{{ _('Restore Executed') }}</option>
                    <option value="config.update">{{ _('Config Updated') }}</option>
                </select>
                <input type="text" class="search-input" placeholder="{{ _('Search...') }}" id="auditSearch">
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>{{ _('Action') }}</th>
                        <th>{{ _('Resource') }}</th>
                        <th>{{ _('Operator') }}</th>
                        <th>{{ _('IP Address') }}</th>
                        <th>{{ _('Time') }}</th>
                    </tr>
                </thead>
                <tbody id="auditTableBody">
                    <tr><td colspan="5" class="empty-state">{{ _('Loading...') }}</td></tr>
                </tbody>
            </table>
        </div>
        <div class="panel-actions">
            <span id="auditCount" class="audit-count"></span>
            <button class="btn btn-outline btn-sm" id="btnAuditPrev" disabled>{{ _('Previous') }}</button>
            <button class="btn btn-outline btn-sm" id="btnAuditNext">{{ _('Next') }}</button>
        </div>
    </div>

</div>

<script src="/admin/vault/static/vault.js"></script>
</body>
</html>
