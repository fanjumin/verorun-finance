<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage — VeroRun Vault</title>
    <link rel="stylesheet" href="/admin/static/css/themes.css">
    <link rel="stylesheet" href="/admin/vault/static/vault.css">
</head>
<body>

<div class="vault-dashboard">

    {% include 'vault_nav.html' %}

    <div class="vault-page-header">
        <h2>{{ _('Storage Targets') }}</h2>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>{{ _('Configured Storage Targets') }}</h3>
            <button class="btn btn-primary btn-sm" id="btnNewStorage">+ {{ _('Add Target') }}</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>{{ _('Name') }}</th>
                        <th>{{ _('Type') }}</th>
                        <th>{{ _('Status') }}</th>
                        <th>{{ _('Last Test') }}</th>
                        <th>{{ _('Actions') }}</th>
                    </tr>
                </thead>
                <tbody id="storageTableBody">
                    <tr><td colspan="5" class="empty-state">{{ _('Loading...') }}</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Storage form -->
    <div class="card hidden" id="storageFormCard">
        <div class="card-header">
            <h3 id="storageFormTitle">{{ _('Add Storage Target') }}</h3>
        </div>
        <form id="storageForm" class="vault-form">
            <input type="hidden" id="storageId">

            <div class="form-row">
                <div class="form-group">
                    <label for="storageName">{{ _('Name') }}</label>
                    <input type="text" id="storageName" class="form-input" required placeholder="{{ _('e.g. AWS S3 Production') }}">
                </div>
                <div class="form-group">
                    <label for="storageType">{{ _('Storage Type') }}</label>
                    <select id="storageType" class="form-input">
                        <option value="local">{{ _('Local') }}</option>
                        <option value="s3">{{ _('S3 Compatible') }}</option>
                        <option value="oss">{{ _('Alibaba Cloud OSS') }}</option>
                        <option value="azure">{{ _('Azure Blob') }}</option>
                        <option value="gcs">{{ _('Google Cloud Storage') }}</option>
                        <option value="sftp">{{ _('SFTP') }}</option>
                        <option value="webdav">{{ _('WebDAV') }}</option>
                    </select>
                </div>
            </div>

            <!-- Dynamic config fields -->
            <div id="storageConfigFields"></div>

            <div class="form-actions">
                <button type="button" class="btn btn-outline" id="btnTestStorage">{{ _('Test Connection') }}</button>
                <span id="testResult" class="form-test-result"></span>
                <button type="button" class="btn btn-outline" id="btnCancelStorage">{{ _('Cancel') }}</button>
                <button type="submit" class="btn btn-primary">{{ _('Save Target') }}</button>
            </div>
        </form>
    </div>

</div>

<script src="/admin/vault/static/vault.js"></script>
</body>
</html>
