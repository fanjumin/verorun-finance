<!-- plugins/visitor_profile/templates/visitor_detail.html -->
<!DOCTYPE html>
<html lang="{{ g.lang_code or 'zh-CN' }}">
<head>
<meta charset="utf-8"/>
<title>{{ _('Visitor Profile Engine') }} - {{ visitor_id }}</title>
<link rel="stylesheet" href="/static/css/design-system.css"/>
<link rel="stylesheet" href="/static/css/themes.css"/>
<script>
(function(){
  var KEY='verorun_admin_theme';
  function apply(){
    try{
      var t=localStorage.getItem(KEY);
      if(t==='slate'||t==='light'){document.documentElement.setAttribute('data-theme',t);}
      else if(document.documentElement.hasAttribute('data-theme')){document.documentElement.removeAttribute('data-theme');}
    }catch(e){}
  }
  apply();
  window.addEventListener('storage',function(e){if(e.key===KEY||e.key===null)apply();});
  setInterval(apply,1000);
})();
</script>
<style>
  .detail-page { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .back-link { display: inline-block; margin-bottom: 16px; color: var(--primary); text-decoration: none; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .detail-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; }
  .detail-section h4 { margin: 0 0 12px; font-size: 14px; color: var(--text-secondary); }
  .detail-section pre { background: var(--bg-elevated); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
  .event-item, .memory-item { padding: 8px 0; border-bottom: 1px solid var(--border-color); }
  .event-type, .memory-type { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--bg-elevated); color: var(--accent); margin-right: 8px; }
  .memory-conf { font-size: 12px; color: var(--success); }
  .event-time { font-size: 12px; color: var(--text-secondary); }
  .kv-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; }
  .kv-label { color: var(--text-secondary); }
  .loading { padding: 40px; text-align: center; color: var(--text-secondary); }
</style>
<script>
window.__t = {{ translations|tojson }};
window.__locale = '{{ g.lang_code or "zh-CN" }}';
</script>
</head>
<body>
<div class="detail-page">
  <a class="back-link" href="/admin/visitor_profile/">&larr; {{ _('Back to Dashboard') }}</a>
  <h2>{{ _('Visitor ID') }}: {{ visitor_id }}</h2>

  <div id="loading" class="loading">{{ _('Unknown') }}...</div>

  <div class="detail-grid" id="detail-grid" style="display:none;">
    <div class="detail-section">
      <h4>{{ _('Basic Info') }}</h4>
      <div id="detail-basic"></div>
    </div>
    <div class="detail-section">
      <h4>{{ _('Profile Summary') }}</h4>
      <div id="detail-profile"></div>
    </div>
    <div class="detail-section">
      <h4>{{ _('Recent Behavior') }}</h4>
      <div id="detail-events"></div>
    </div>
    <div class="detail-section">
      <h4>{{ _('Profile Memories') }}</h4>
      <div id="detail-memories"></div>
    </div>
  </div>
</div>

<script>
function t(key) {
  var d = window.__t || {};
  return d[key] || key;
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var visitorId = {{ visitor_id|tojson }};

fetch('/admin/visitor_profile/api/v1/visitors/' + encodeURIComponent(visitorId))
  .then(function(r) { return r.json(); })
  .then(function(data) {
    document.getElementById('loading').style.display = 'none';
    if (data.error) {
      document.getElementById('detail-grid').style.display = 'block';
      document.getElementById('detail-basic').innerHTML = '<p>' + esc(data.error) + '</p>';
      return;
    }

    var v = data.visitor;
    document.getElementById('detail-grid').style.display = 'grid';

    document.getElementById('detail-basic').innerHTML =
      '<div class="kv-row"><span class="kv-label">' + t('First Seen') + '</span><span>' +
        esc(v.first_seen_at || v.first_seen) + '</span></div>' +
      '<div class="kv-row"><span class="kv-label">' + t('Last Seen') + '</span><span>' +
        esc(v.last_seen_at || v.last_seen) + '</span></div>' +
      '<div class="kv-row"><span class="kv-label">' + t('Location') + '</span><span>' +
        esc(v.country || t('Unknown')) + (v.city ? ', ' + esc(v.city) : '') + '</span></div>' +
      '<div class="kv-row"><span class="kv-label">' + t('Total Visits') + '</span><span>' +
        esc(v.total_visits) + '</span></div>' +
      '<div class="kv-row"><span class="kv-label">' + t('Total Events') + '</span><span>' +
        esc(v.total_events) + '</span></div>';

    document.getElementById('detail-profile').innerHTML =
      '<pre>' + esc(JSON.stringify(v.profile_summary || {}, null, 2)) + '</pre>';

    var eventsHtml = '';
    (data.events || []).forEach(function(e) {
      eventsHtml += '<div class="event-item">' +
        '<span class="event-type">' + esc(e.event_type) + '</span>' +
        '<span class="event-page">' + esc(e.page_title || e.page_url || '') + '</span>' +
        '<span class="event-time">' + esc(e.server_ts || e.client_ts || '') + '</span>' +
        '</div>';
    });
    document.getElementById('detail-events').innerHTML = eventsHtml || '<p>' + t('Unknown') + '</p>';

    var memHtml = '';
    (data.memories || []).forEach(function(m) {
      var conf = m.confidence ? (m.confidence * 100).toFixed(0) + '%' : '';
      memHtml += '<div class="memory-item">' +
        '<span class="memory-type">' + esc(m.memory_type) + '</span>' +
        '<span class="memory-conf">' + conf + '</span>' +
        '<pre>' + esc(JSON.stringify(m.content, null, 2)) + '</pre>' +
        '</div>';
    });
    document.getElementById('detail-memories').innerHTML = memHtml || '<p>' + t('Unknown') + '</p>';
  })
  .catch(function(err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('detail-grid').style.display = 'grid';
    document.getElementById('detail-basic').innerHTML = '<p>' + esc(String(err)) + '</p>';
  });
</script>
</body>
</html>
